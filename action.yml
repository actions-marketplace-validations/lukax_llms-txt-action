name: Generate llms.txt with llms.ink
description: Generate llms.txt (and optionally llms-full.txt) for any website, docs section or GitHub repo, so AI models can read it.
author: lukax
branding:
  icon: file-text
  color: blue

inputs:
  url:
    description: The site, docs section, page or GitHub repo to generate for (or to check), e.g. https://example.com or https://github.com/owner/repo.
    required: true
  path:
    description: Where to write llms.txt (default `llms.txt`). In `commit` and `pr` modes, a path inside the repository; in `comment` mode, the file to compare against; in `check` mode, the file to lint, only when set explicitly (see `check-target`).
    default: ''
  full-path:
    description: Where to write llms-full.txt (the index followed by the Markdown of up to 20 linked pages). Leave empty to skip it. Not used in `check` and `comment` modes.
    default: ''
  fresh:
    description: Rebuild instead of using llms.ink's cache (results are cached for 24 hours). Each rebuild counts against the daily quota (60 per IP address without a key).
    default: 'true'
  mode:
    description: '`write` the file (default); `commit` it to the branch when it changed; open or update a `pr`; `check` llms.txt (the file at `path` in the checkout, or the one the site publishes) and fail on errors or broken links; or `comment` the section diff on a pull request.'
    default: write
  api-key:
    description: 'Optional llms.ink API key (`lk_…`), sent as `Authorization: Bearer`. Gives the job its own daily quota instead of the runner''s shared IP quota. Use a secret, e.g. secrets.LLMS_INK_KEY.'
    default: ''
  generated:
    description: 'Always generate, never copy the site''s own llms.txt (sends `native=0`). Set it to `true` when your /llms.txt is served from llms.ink.'
    default: 'false'
  commit-message:
    description: Commit message in `commit` and `pr` modes; also the pull request title.
    default: Update llms.txt
  branch:
    description: '`commit` mode: the branch to commit to (default: the branch the workflow runs on). `pr` mode: the branch the pull request is opened from (default: llms-ink/llms-txt).'
    default: ''
  token:
    description: GitHub token for `commit`, `pr` and `comment` modes. Commits pushed with the default token don't start other workflows; pass a personal access token or GitHub App token for that.
    default: ${{ github.token }}
  check-target:
    description: '`check` mode: `auto` lints the file at `path` when `path` is set and the file exists in the workspace, and otherwise checks the llms.txt the site at `url` publishes; `file` always lints the file at `path` (default `llms.txt`; fails when it''s missing); `live` always checks the site.'
    default: auto
  links:
    description: '`check` mode on a file: also check up to 25 linked URLs and llms-full.txt next to `url`. The live check always checks links.'
    default: 'true'

outputs:
  changed:
    description: '`true` when the generated file differs from the previous one: the file on disk (`write`, `comment`) or on the branch (`commit`, `pr`). Always `false` in `check` mode.'
    value: ${{ steps.llms.outputs.changed }}
  tokens:
    description: Estimated tokens in llms.txt (in `check` mode, in the published file).
    value: ${{ steps.llms.outputs.tokens }}
  path:
    description: Where llms.txt was written; empty in `check` and `comment` modes.
    value: ${{ steps.llms.outputs.path }}
  pr-url:
    description: The pull request opened or updated in `pr` mode (or the open one, when nothing changed).
    value: ${{ steps.llms.outputs.pr-url }}
  source:
    description: '`generated` when llms.ink wrote the file; `native` when the site publishes its own llms.txt, which is copied as is.'
    value: ${{ steps.llms.outputs.source }}
  pages:
    description: How many links llms.txt covers.
    value: ${{ steps.llms.outputs.pages }}

runs:
  using: composite
  steps:
    - id: llms
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FULL_PATH: ${{ inputs.full-path }}
        INPUT_FRESH: ${{ inputs.fresh }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_GENERATED: ${{ inputs.generated }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_CHECK_TARGET: ${{ inputs.check-target }}
        INPUT_LINKS: ${{ inputs.links }}
      run: |
        command -v node >/dev/null || { echo '::error title=llms.ink::Node.js 20 or later is required on the runner.'; exit 1; }
        node "$GITHUB_ACTION_PATH/src/main.mjs"
