name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  context-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test test/context-paths.test.mjs

  context-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix "$RUNNER_TEMP/context-cli" --ignore-scripts --no-audit --no-fund @lukax/llms-ink@0.7.2
      - run: node --test test/context-installed.test.mjs
        env:
          LLMS_INK_CONTEXT_CLI: ${{ runner.temp }}/context-cli/node_modules/@lukax/llms-ink

  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: llms
        uses: ./
        with:
          url: https://github.com/${{ github.repository }}
          path: out/llms.txt
          full-path: out/llms-full.txt
          generated: true
      - name: Check the files
        env:
          SOURCE: ${{ steps.llms.outputs.source }}
          PAGES: ${{ steps.llms.outputs.pages }}
          CHANGED: ${{ steps.llms.outputs.changed }}
          OUT: ${{ steps.llms.outputs.path }}
        run: |
          set -x
          test "$SOURCE" = generated
          test "$PAGES" -gt 0
          test "$CHANGED" = true
          test "$OUT" = out/llms.txt
          head -n 1 out/llms.txt | grep -q '^# '
          tail -n 1 out/llms.txt | grep -qx '<!-- Generated with https://llms.ink -->'
          grep -q '^---$' out/llms-full.txt

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: llms
        uses: ./
        with:
          url: https://llmstxt.org
          mode: check
      - run: test "${{ steps.llms.outputs.tokens }}" -gt 0
