# This repo's own llms.txt, kept current by the action itself (the README's "commit" example).
name: llms.txt
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  llms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          url: https://github.com/${{ github.repository }}
          mode: commit
